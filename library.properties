sentence=Timbangan digital berbahasa Indonesia dengan HX711 dan load cell: non-blocking, tara, kalibrasi, deteksi kabel lepas.
paragraph=perbarui() tidak pernah menunggu dan interrupt hanya dimatikan beberapa mikrodetik per pulsa clock, bukan sepanjang pembacaan. Tara dan kalibrasi berjalan di latar belakang; offset dan faktor bisa disimpan ke EEPROM. Melaporkan kabel lepas, data jenuh, dan masa settling dengan pesan berbahasa Indonesia. Gain 128/64 dan kanal B, mode tidur, banyak timbangan sekaligus. Untuk modul HX711, load cell 1-200 kg, YZC-131, sensor berat setengah jembatan. English: HX711 load cell scale weight, non-blocking, tare, calibration, disconnect detection.
